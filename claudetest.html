    <style>
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --muted: #b8b8b8;
            --line: #7d7d7d;
            --green: #4ced40;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: "Webpixel", sans-serif;
            overflow-x: hidden;
        }

        .page-frame {
            min-height: 100vh;
            border: 2px solid var(--line);
            background: #000;
        }

        .topbar {
            height: 78px;
            border-bottom: 2px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
        }

        .back-link {
            color: var(--green);
            font-size: 16px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* GRID */
        .grid-section {
            width: min(1400px, 90%);
            margin: 60px auto;
        }

        .grid-title {
            color: var(--green);
            font-size: 24px;
            margin-bottom: 30px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .grid-item {
            border: 2px solid var(--line);
            background: #020202;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .grid-item:hover {
            border-color: var(--green);
            transform: scale(1.02);
        }

        .grid-item img,
        .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(100%) brightness(0.7) contrast(1.1);
            transition: filter 0.25s ease, transform 0.25s ease;
        }

        .grid-item:hover img,
        .grid-item:hover video {
            filter: grayscale(0%) brightness(1) contrast(1);
            transform: scale(1.03);
        }

        /* LIGHTBOX */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        .lightbox-overlay.active {
            display: flex;
        }

        #lightbox-img,
        #lightbox-video {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border: 2px solid var(--line);
        }

        .grid-item[data-type="video"] video[poster] {
            filter: grayscale(100%) brightness(0.7) contrast(1.1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            color: var(--green);
            font-size: 18px;
            cursor: pointer;
            background: none;
            border: 2px solid var(--green);
            padding: 8px 14px;
            font-family: "Webpixel", sans-serif;
        }

        .lightbox-close:hover {
            background: var(--green);
            color: #000;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .image-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .image-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <!-- LIGHTBOX -->
    <div class="lightbox-overlay" id="lightbox">
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <img src="" alt="Full preview" id="lightbox-img" style="display:none;">
        <video controls autoplay id="lightbox-video" style="display:none;">
            <source src="" type="video/mp4">
        </video>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxVid = document.getElementById('lightbox-video');

        // Open lightbox on grid-item click
        document.querySelectorAll('.grid-item').forEach(item => {
            item.addEventListener('click', () => {
                const type = item.dataset.type;
                const src = item.dataset.src;
                lightboxImg.style.display = 'none';
                lightboxVid.style.display = 'none';
                if (type === 'video') {
                    lightboxVid.querySelector('source').src = src;
                    lightboxVid.src = src;
                    lightboxVid.style.display = 'block';
                    lightboxVid.play();
                } else {
                    const imgSrc = item.querySelector('img').src || src;
                    lightboxImg.src = imgSrc;
                    lightboxImg.alt = item.querySelector('img')?.alt + ' (full view)' || '';
                    lightboxImg.style.display = 'block';
                }
                lightbox.classList.add('active');
            });
        });

        // Close on button, overlay click, or Escape key
        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxVid.pause();
        }

        lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
